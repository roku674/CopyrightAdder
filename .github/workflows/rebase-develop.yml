name: Sync develop with master

on:
  push:
    branches:
      - master

permissions:
  contents: write   # allows pushing to develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all branches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # PRs into master are squash-merged, so rebasing develop replays already-squashed
      # commits and conflicts. Instead: reset develop when trees match, else merge.
      - name: Sync develop with master
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin develop >/dev/null; then
            echo "No develop branch on origin; nothing to sync."
            exit 0
          fi
          git fetch origin develop:refs/remotes/origin/develop --force
          if git diff --quiet origin/master origin/develop; then
            lease=$(git rev-parse origin/develop)
            git push origin origin/master:refs/heads/develop --force-with-lease=develop:$lease
            echo "Path: reset (trees identical, develop now equals master)"
            exit 0
          fi
          git checkout -B develop origin/develop
          if ! git merge --no-edit -X ours origin/master; then
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort
            echo "::error::Merge of master into develop failed. Conflicting files: $files"
            exit 1
          fi
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . >/dev/null; then
            echo "::error::Conflict markers remain: $(git grep -lE '^(<<<<<<< |>>>>>>> )' -- . | tr '\n' ' ')"
            exit 1
          fi
          git push origin develop
          echo "Path: merge (develop had unmerged work, merged master into it)"
